services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./media_data:/app/media
      - ./static_data:/app/static
    env_file:
      - .env
    expose:
      - 8000
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - ./db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=raha
      - POSTGRES_USER=raha_user
      - POSTGRES_PASSWORD=raha_pass

  nginx:
    image: nginx:1.25
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./static_data:/app/static
      - ./media_data:/app/media
    ports:
      - "80:80"
    depends_on:
      - web

  tunnel:
    image: cloudflare/cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
