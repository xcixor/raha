<div id="model_name-container" class="bg-gray-700 p-4 rounded-lg w-full max-w-sm relative">
    <form hx-post="{% url 'models:edit_name' slug=profile.slug %}" 
          hx-target="#model_name-container" 
          hx-swap="outerHTML"
          hx-indicator="#model_name-indicator"
          class="space-y-3">
        {% csrf_token %}
        <div>
            <label class="text-xs font-bold text-gray-400 uppercase">Model Name</label>
            {{ form.model_name }}
            {% if form.model_name.errors %}
                <p class="text-red-500 text-xs mt-1">{{ form.model_name.errors.0 }}</p>
            {% endif %}
        </div>
        <div class="flex space-x-2">
            <button type="submit" class="bg-pink-600 px-4 py-1 rounded text-sm font-bold flex-1">Save</button>
            <button type="button" 
                    hx-get="{% url 'models:edit_name' slug=profile.slug %}?mode=display" 
                    hx-target="#model_name-container" 
                    hx-swap="outerHTML"
                    class="bg-gray-800 px-4 py-1 rounded text-sm font-bold">Cancel</button>
        </div>
        
        <div id="model_name-indicator" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-gray-800/50 rounded">
            <i class="fa-solid fa-circle-notch animate-spin text-pink-500"></i>
        </div>
    </form>
</div>
