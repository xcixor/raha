<div id="media-item-{{ media.pk }}" class="relative group aspect-square bg-gray-900 rounded-lg overflow-hidden border border-gray-700">
    {% if media.is_video %}
        <video src="{{ media.file.url }}" class="w-full h-full object-cover"></video>
    {% else %}
        <img src="{{ media.file.url }}" alt="Gallery Item" class="w-full h-full object-cover">
    {% endif %}
    
    {% if is_owner or request.user == media.profile.user %}
    <button hx-delete="{% url 'models:gallery_remove' pk=media.pk %}"
            hx-target="#media-item-{{ media.pk }}"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to remove this from your gallery?"
            class="absolute top-2 right-2 w-6 h-6 flex items-center justify-center bg-red-600 rounded-full opacity-0 group-hover:opacity-100 transition shadow-lg">
        <i class="fa-solid fa-trash-can text-[10px] text-white"></i>
    </button>
    {% endif %}
</div>
