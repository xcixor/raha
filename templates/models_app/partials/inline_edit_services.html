<div id="services-container" class="bg-gray-800 p-6 rounded-lg relative">
    <form hx-post="{% url 'models:edit_services' slug=profile.slug %}" 
          hx-target="#services-container" 
          hx-swap="outerHTML"
          hx-indicator="#services-indicator"
          class="space-y-4">
        {% csrf_token %}
        <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Edit Services</h2>
        
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            {% for svc in form.fields.services.queryset %}
            <label class="flex items-center space-x-2 text-sm cursor-pointer hover:bg-gray-700 p-2 rounded transition-colors">
                <input type="checkbox" name="services" value="{{ svc.id }}" 
                       {% if svc in profile.services.all %}checked{% endif %}
                       class="rounded border-gray-700 text-pink-600 focus:ring-pink-500 bg-gray-900">
                <span>{{ svc.name }}</span>
            </label>
            {% endfor %}
        </div>

        <div class="flex space-x-2 mt-4 pt-4 border-t border-gray-700">
            <button type="submit" class="bg-pink-600 px-6 py-2 rounded text-sm font-bold flex-1">Save Services</button>
            <button type="button" 
                    hx-get="{% url 'models:edit_services' slug=profile.slug %}?mode=display" 
                    hx-target="#services-container" 
                    hx-swap="outerHTML"
                    class="bg-gray-700 px-6 py-2 rounded text-sm font-bold flex-1">Cancel</button>
        </div>
        
        <div id="services-indicator" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-gray-800/50 rounded">
            <i class="fa-solid fa-circle-notch animate-spin text-pink-500 text-3xl"></i>
        </div>
    </form>
</div>
