<div id="location-container" class="bg-gray-700 p-4 rounded w-full max-w-md relative">
    <form hx-post="{% url 'models:edit_location' slug=object.slug %}" 
          hx-target="#location-container" 
          hx-swap="outerHTML"
          hx-indicator="#location-indicator"
          class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="text-xs font-bold text-gray-400 uppercase block mb-1">Primary Location</label>
            <select name="primary_location" 
                    hx-get="{% url 'models:nearby_locations_htmx' %}" 
                    hx-target="#nearby-locations-edit" 
                    hx-indicator="#nearby-indicator"
                    hx-swap="outerHTML"
                    hx-trigger="change"
                    class="w-full bg-gray-900 border border-gray-600 text-white rounded p-2 text-sm outline-none focus:border-pink-500 transition-colors">
                {% for loc in form.fields.primary_location.queryset %}
                    <option value="{{ loc.id }}" {% if object.primary_location_id == loc.id %}selected{% endif %}>{{ loc.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="relative">
            <label class="text-xs font-bold text-gray-400 uppercase block mb-1 flex items-center">
                Nearby Locations
                <div id="nearby-indicator" class="htmx-indicator ml-2">
                    <i class="fa-solid fa-circle-notch animate-spin text-pink-500 text-[10px]"></i>
                </div>
            </label>
            {% include "models_app/partials/nearby_locations_options.html" with locations=form.fields.nearby_locations.queryset|dictsort:"name" selected_locations=object.nearby_locations.all %}
        </div>

        <div class="flex space-x-2 pt-2 border-t border-gray-600">
            <button type="submit" class="bg-pink-600 px-4 py-1 rounded text-sm font-bold flex-1">Save Locations</button>
            <button type="button" 
                    hx-get="{% url 'models:edit_location' slug=object.slug %}?mode=display" 
                    hx-target="#location-container" 
                    hx-swap="outerHTML"
                    class="bg-gray-800 px-4 py-1 rounded text-sm font-bold">Cancel</button>
        </div>
        
        <div id="location-indicator" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-gray-800/50 rounded z-10">
            <i class="fa-solid fa-circle-notch animate-spin text-pink-500 text-2xl"></i>
        </div>
    </form>
</div>
