<div id="short_summary-container" class="bg-gray-700 p-3 rounded w-full relative">
    <form hx-post="{% url 'models:edit_summary' slug=profile.slug %}" 
          hx-target="#short_summary-container" 
          hx-swap="outerHTML"
          hx-indicator="#short_summary-indicator"
          class="space-y-2">
        {% csrf_token %}
        <div>
            <label class="text-[10px] font-bold text-gray-400 uppercase">Short Summary</label>
            {{ form.short_summary }}
        </div>
        <div class="flex space-x-2">
            <button type="submit" class="bg-pink-600 px-3 py-1 rounded text-xs font-bold flex-1">Save</button>
            <button type="button" 
                    hx-get="{% url 'models:profile_detail' slug=profile.slug %}" 
                    hx-target="#short_summary-container" 
                    hx-swap="outerHTML"
                    hx-select="#short_summary-container"
                    class="bg-gray-800 px-3 py-1 rounded text-xs font-bold">Cancel</button>
        </div>
        
        <div id="short_summary-indicator" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-gray-800/50 rounded">
            <i class="fa-solid fa-circle-notch animate-spin text-pink-500"></i>
        </div>
    </form>
</div>
