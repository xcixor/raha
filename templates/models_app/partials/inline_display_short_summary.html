<div id="short_summary-container" class="group">
    <div class="flex items-center space-x-2">
        <p class="text-pink-500 font-medium italic">{{ profile.short_summary }}</p>
        {% if is_owner %}
        <button hx-get="{% url 'models:edit_summary' slug=profile.slug %}" 
                hx-target="#short_summary-container" 
                hx-swap="outerHTML"
                class="text-gray-500 hover:text-pink-500 opacity-0 group-hover:opacity-100 transition-opacity">
            <i class="fa-solid fa-pencil text-xs"></i>
        </button>
        {% endif %}
    </div>
</div>
