<div id="description-container" class="bg-gray-800 p-6 rounded-lg relative">
    <form hx-post="{% url 'models:edit_description' slug=profile.slug %}" 
          hx-target="#description-container" 
          hx-swap="outerHTML"
          hx-indicator="#description-indicator"
          class="space-y-4">
        {% csrf_token %}
        <h2 class="text-xl font-bold mb-4 border-b border-gray-700 pb-2">Edit Description</h2>
        
        <div>
            <textarea name="description" 
                      rows="6" 
                      class="w-full bg-gray-900 border border-gray-700 text-white rounded p-4 focus:border-pink-500 outline-none transition-colors">{{ profile.description }}</textarea>
        </div>

        <div class="flex space-x-2">
            <button type="submit" class="bg-pink-600 px-6 py-2 rounded text-sm font-bold flex-1">Save Description</button>
            <button type="button" 
                    hx-get="{% url 'models:profile_detail' slug=profile.slug %}" 
                    hx-target="#description-container" 
                    hx-swap="outerHTML"
                    hx-select="#description-container"
                    class="bg-gray-700 px-6 py-2 rounded text-sm font-bold">Cancel</button>
        </div>

        <div id="description-indicator" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-gray-800/50 rounded">
            <i class="fa-solid fa-circle-notch animate-spin text-pink-500 text-3xl"></i>
        </div>
    </form>
</div>
