<div id="description-container" class="group">
    <div class="flex items-center justify-between mb-4 border-b border-gray-700 pb-2">
        <h2 class="text-xl font-bold">Description</h2>
        {% if is_owner %}
        <button hx-get="{% url 'models:edit_description' slug=profile.slug %}" 
                hx-target="#description-container" 
                hx-swap="outerHTML"
                class="text-gray-500 hover:text-pink-500 opacity-0 group-hover:opacity-100 transition-opacity">
            <i class="fa-solid fa-pencil text-sm"></i>
        </button>
        {% endif %}
    </div>
    <p class="text-gray-300 whitespace-pre-wrap">{{ profile.description }}</p>
</div>
