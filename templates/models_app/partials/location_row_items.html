<div class="flex items-center space-x-2 overflow-x-auto pb-4 no-scrollbar">
    <button hx-get="{% url 'models:list' %}?county={{ active_county.slug }}&location=all&service={{ request.GET.service|default:'all' }}"
            hx-target="#model-grid"
            hx-indicator="#grid-loader"
            hx-push-url="true"
            @click="activeLocation = 'all'"
            :class="activeLocation === 'all' ? 'bg-pink-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
            class="px-4 py-2 rounded-full text-sm font-medium transition-colors whitespace-nowrap">
        All in {{ active_county.name }}
    </button>
    
    {% for loc in locations %}
    <button hx-get="{% url 'models:list' %}?county={{ active_county.slug }}&location={{ loc.slug }}&service={{ request.GET.service|default:'all' }}"
            hx-target="#model-grid"
            hx-indicator="#grid-loader"
            hx-push-url="true"
            @click="activeLocation = '{{ loc.slug }}'"
            :class="activeLocation === '{{ loc.slug }}' ? 'bg-pink-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'"
            class="px-4 py-2 rounded-full text-sm font-medium transition-colors whitespace-nowrap">
        {{ loc.name }}
    </button>
    {% endfor %}
</div>
