<div id="location-container" class="group">
    <div class="flex items-center space-x-2">
        <p class="text-gray-400">{{ profile.primary_location.name }}</p>
        {% if is_owner %}
        <button hx-get="{% url 'models:edit_location' slug=profile.slug %}" 
                hx-target="#location-container" 
                hx-swap="outerHTML"
                class="text-pink-500 hover:text-pink-400 p-1">
            <i class="fa-solid fa-pencil text-[10px]"></i>
        </button>
        {% endif %}
    </div>
    {% if profile.nearby_locations.exists %}
    <p class="text-gray-500 text-sm mt-1">Nearby: {{ profile.nearby_locations.all|join:", " }}</p>
    {% endif %}
</div>
