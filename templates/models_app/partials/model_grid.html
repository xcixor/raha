<div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
    {% for profile in models %}
    <div class="group relative bg-gray-900 rounded-xl overflow-hidden transition-all duration-300 shadow-lg cursor-pointer"
         onclick="if(!event.target.closest('button') && !event.target.closest('a')) window.location.href='{% url 'models:public_profile_detail' slug=profile.slug %}'">
        
        <div class="relative aspect-[3/4]">
            <img src="{{ profile.pfp.url }}" alt="{{ profile.model_name }}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">

            <!-- Main glass container: high opacity, no blur -->
            <div class="absolute bottom-2 left-2 right-2 p-2 bg-black/95 rounded-lg border border-white/10 shadow-2xl">
                
                <!-- Inner details container: lower opacity than parent, padded -->
                <div class="bg-white/20 p-3 rounded-md mb-2">
                    <h2 class="text-lg font-bold truncate leading-tight">{{ profile.model_name }}</h2>
                    <p class="text-sm text-gray-300 flex items-center mb-1">
                        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                        </svg>
                        {{ profile.primary_location.name }}
                    </p>
                    <p class="text-xs text-pink-400 italic font-medium truncate">{{ profile.short_summary }}</p>
                </div>

                <!-- Contact Buttons -->
                <div class="flex space-x-2" x-data="{
                    openWa(phone) {
                        const link = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
                            ? `https://wa.me/${phone}`
                            : `https://web.whatsapp.com/send?phone=${phone}`;
                        window.open(link, '_blank');
                    }
                }">
                    <a href="tel:{{ profile.user.phone_number }}"
                       @click.stop
                       class="flex-1 bg-gray-800 hover:bg-gray-700 text-white text-[10px] font-bold py-2 rounded flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-phone mr-1"></i> CALL
                    </a>
                    <button @click.stop.prevent="openWa('{{ profile.whatsapp_number }}')"
                            class="flex-1 bg-green-600 hover:bg-green-700 text-white text-[10px] font-bold py-2 rounded flex items-center justify-center transition-colors">
                        <i class="fa-brands fa-whatsapp mr-1 text-sm"></i> WHATSAPP
                    </button>
                </div>
            </div>

            {% if profile.is_verified %}
            <div class="absolute top-2 right-2 bg-blue-500 text-white p-1 rounded-full shadow-lg">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.061 2.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"></path>
                </svg>
            </div>
            {% endif %}
        </div>
    </div>
    {% empty %}
    <div class="col-span-full text-center py-20 bg-gray-800 rounded-2xl">
        <p class="text-xl text-gray-400">No models found for this selection.</p>
    </div>
    {% endfor %}
</div>
